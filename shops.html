<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoopy Shops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B1E54}a:hover{color:#D6336C}
.soc{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);transition:all .25s}
.soc:hover{color:#fff;background:linear-gradient(135deg,#F2FAFF 0%,#B79CFF 45%,#7B3FE4 100%);border-color:#fff;box-shadow:0 0 0 4px rgba(183,156,255,.35),0 10px 26px rgba(123,63,228,.6);transform:translateY(-4px)}
.nl2{text-decoration:none;font-weight:600;font-size:18px;color:#fff;padding:10px 4px}
.nl2:hover{color:#FFB3D1}
@supports not selector(::-webkit-scrollbar){html{scrollbar-color:#FF8FB8 #CDEBFF}}
::-webkit-scrollbar{width:18px;height:18px}
::-webkit-scrollbar-track{background:#CDEBFF;border-left:3px solid #3B1E54}
::-webkit-scrollbar-thumb{background:repeating-linear-gradient(45deg,#FF8FB8 0 10px,#fff 10px 20px);border:3px solid #3B1E54;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:repeating-linear-gradient(45deg,#D6336C 0 10px,#FFB3D1 10px 20px)}
@media (hover:hover) and (pointer:fine){html,body,*{cursor:none !important}}
@media (hover:none),(pointer:coarse){#scoop-cursor{display:none !important}}
#scoop-cursor .ci{transform-origin:0 0;transition:transform .15s ease-out}
#scoop-cursor.cur-hot .ci{transform:scale(1.25)}
#scoop-cursor.cur-down .ci{transform:scale(.85)}
#scoop-cursor .cf{transition:background .15s}
#scoop-cursor.cur-hot .cf{background:linear-gradient(135deg,rgba(255,255,255,.98) 0%,rgba(170,228,255,.8) 45%,rgba(110,190,250,.75) 100%)}
#scoop-cursor .sp{animation:twk 1.4s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(.6) rotate(0deg);opacity:.6}50%{transform:scale(1.1) rotate(45deg);opacity:1}}

.rv{animation:rv 3s linear infinite}
@keyframes rv{from{transform:translateY(0)}to{transform:translateY(60px)}}
.carh{animation:carH linear infinite}
.carv{animation:carV linear infinite}
@keyframes carH{from{transform:translate3d(var(--x0),var(--y),0)}to{transform:translate3d(var(--x1),var(--y),0)}}
@keyframes carV{from{transform:translate3d(var(--x),var(--y0),0)}to{transform:translate3d(var(--x),var(--y1),0)}}
.mkf{animation:mkf 2.4s ease-in-out infinite}
@keyframes mkf{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.ring{animation:ring 2s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:.8}to{transform:scale(1.7);opacity:0}}
.beacon{animation:bk .8s ease-in-out infinite alternate}
@keyframes bk{from{opacity:.35}to{opacity:1}}
.drift{animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
.shopbtn{transition:transform .15s,box-shadow .15s}
.shopbtn:hover{transform:translateY(-4px)}
.mk-btn{display:block;padding:0;border:0;background:none;cursor:pointer}
.logo{transition:transform .2s}
.logo:active{transform:translateX(-50%) scale(.97) !important}
.logo .lt{position:absolute;top:20px;display:block;text-align:center;line-height:1.15;opacity:1;transition:transform .5s cubic-bezier(.55,0,.25,1) .3s,opacity .25s ease .3s,color .3s ease .3s}
.logo .lS{left:16px;width:24px;--dx:57px}
.logo .lc{left:40px;width:20px;--dx:35px}
.logo .lo1{left:60px;width:24px}
.logo .lo2{left:84px;width:24px}
.logo .lp{left:108px;width:24px;--dx:-35px}
.logo .ly{left:132px;width:22px;--dx:-58px}
.logo .smile{position:absolute;left:50%;top:60px;width:0;height:0;transform:translateX(-50%);border-bottom:5px solid #fff;border-radius:0 0 40px 40px;box-sizing:content-box;opacity:0;transition:height .25s ease 0s,width .3s ease .15s,opacity .12s ease .3s}
.logo .ball{position:absolute;top:22px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transform:scale(0);transition:transform .22s ease .1s}
.logo .b1{left:54px}
.logo .b2{left:88px}
.logo .pupil{position:absolute;left:9px;top:9px;width:10px;height:10px;transition:transform .08s linear}
.logo .dot{display:block;width:10px;height:10px;border-radius:50%;background:#3B1E54;transform:scale(0);transition:transform .15s ease 0s}
.logo.face .lt{transition:transform .5s cubic-bezier(.55,0,.25,1) 0s,opacity .2s ease .42s,color .25s ease 0s;color:#fff}
.logo.face .lS,.logo.face .lc,.logo.face .lp,.logo.face .ly{transform:translate(var(--dx),24px) scale(.9,.05);opacity:0}
.logo.face .lo1{transform:translate(-4px,-9px) scale(1.12);opacity:0}
.logo.face .lo2{transform:translate(6px,-9px) scale(1.12);opacity:0}
.logo.face .smile{opacity:1;width:46px;height:16px;transition:width .35s ease .38s,height .45s cubic-bezier(.3,1.5,.5,1) .65s,opacity .1s ease .36s}
.logo.face .ball{transform:scale(1);transition:transform .4s cubic-bezier(.3,1.6,.5,1) .42s}
.logo.face .dot{transform:scale(1);transition:transform .3s cubic-bezier(.3,1.6,.5,1) .78s}
.tb-sp{display:none}
@media (max-width:1100px){
.tb-links{gap:14px !important}
.nl2{font-size:16px !important}
.tb-ptext{display:none !important}
.tb-phone{padding:8px 10px !important}
}
@media (max-width:900px){
.topbar{padding:8px 5% 10px !important}
.tb-in{display:grid !important;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);grid-template-areas:"del sp ph" "links links links";gap:6px 0 !important}
.tb-left{display:contents !important}
.tb-del{grid-area:del;justify-self:start;max-width:100%;min-width:0;padding:5px 10px 5px 5px !important;gap:6px !important}
.tb-dtext{min-width:0;overflow:hidden}
.tb-dlabel{display:none !important}
.tb-daddr{font-size:13px !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-chev{display:none !important}
.tb-ico{width:28px !important;height:28px !important;flex:0 0 28px}
.tb-phone{grid-area:ph;justify-self:end;padding:5px !important}
.tb-sp{display:block;grid-area:sp;height:54px}
.tb-links{grid-area:links;justify-content:space-between !important;gap:2px !important;flex-wrap:nowrap !important}
.nl2{font-size:14px !important;padding:6px 4px !important}
.logo{scale:.64;transform-origin:50% 0 !important}
.btn{font-size:17px !important;padding:12px 22px !important}
.cartfab{width:54px !important;height:54px !important;right:14px !important;bottom:14px !important}
[role=dialog] .ph{width:56px !important;height:56px !important;flex:0 0 56px !important;border-radius:16px !important}
[role=dialog] button[aria-label="Add one"],[role=dialog] button[aria-label="Remove one"]{width:38px !important;height:38px !important}
.fpad{padding:0 5% !important;gap:16px !important}
.foot{padding:30px 0 !important}
/* home */
#hero-wrap{height:auto !important}
.hpin{position:relative !important;top:auto !important;margin:14px 5% 0 !important;border-radius:28px !important;min-height:0 !important}
.hpad{padding:0 5% !important}
.hrow{padding:26px 0 70px !important;gap:6px !important;justify-content:center}
.htext{flex:1 1 100% !important;min-width:0 !important}
.h1x{font-size:clamp(40px,11.5vw,64px) !important}
.hp{font-size:18px !important;margin-top:16px !important}
.hbtns{gap:12px !important;margin-top:22px !important}
.hcol{zoom:.8;flex:0 0 auto !important;min-width:0 !important}
#hero-cue{bottom:80px !important}
#hero-cue .bob{font-size:14px !important;padding:6px 16px !important}
#menu{margin-top:18px !important}
.tabin{padding:8px 5% !important;gap:6px !important}
.tarrow{width:34px !important;height:34px !important}
#tabs-scroll a{font-size:15px !important;padding:9px 16px !important}
.mwrap{padding:24px 0 4px !important}
.mpad{padding:0 5% !important}
.msec{margin-bottom:40px !important;scroll-margin-top:70px !important}
.mban{padding:18px 5% !important;min-height:0 !important;gap:14px !important;border-radius:26px !important;flex-wrap:nowrap !important}
.mface{zoom:.55}
.mtxt{flex:1 1 0 !important}
.mh2{font-size:clamp(26px,8vw,40px) !important}
.mtag{font-size:16px !important;margin-top:8px !important}
.mgrid{gap:14px !important;margin-top:16px !important}
.pcard{padding:12px !important;gap:12px !important;border-radius:22px !important}
.ptile{flex:0 0 104px !important;width:104px !important;height:104px !important}
.ptile .ph{width:104px !important;height:104px !important;border-radius:22px !important}
.pcard>div:first-child>div:nth-child(1){font-size:18px !important}
.pcard>div:first-child>div:nth-child(2){font-size:14px !important}
.pcard>div:first-child>div:nth-child(3){margin-top:8px !important}
.why{padding:44px 0 !important}
.wpad{padding:0 5% !important}
.wgrid{gap:22px !important;margin-top:28px !important}
.wcard{padding:22px !important;border-radius:26px !important}
.sh2{font-size:clamp(30px,9vw,44px) !important}
.party{min-height:560px !important}
.pscene{zoom:.8}
.ppad{padding:44px 5% 0 !important}
.pglass{padding:26px 16px !important;border-radius:30px !important}
.hp2{font-size:17px !important;margin-top:10px !important}
/* shops */
.spad{padding:0 5% !important}
.shead{padding:34px 0 20px !important}
.h1s{font-size:clamp(34px,10vw,52px) !important}
.shp{font-size:17px !important;margin-top:14px !important}
.mapvp{height:min(600px,74vh) !important;border-width:5px !important;border-radius:28px !important;box-shadow:0 8px 0 #9AA9D6,0 18px 30px rgba(59,30,84,.2) !important}
.shcam{transform:rotateX(58deg) scale(1) !important}
.mkb{scale:.78}
.hud{left:10px !important;top:10px !important;padding:8px 14px !important;max-width:calc(100% - 20px) !important;border-radius:18px !important}
.hud>div:nth-child(2){font-size:15px !important}
.mmap{zoom:.62;right:16px !important;bottom:16px !important}
.hint{display:none !important}
.slist{margin-top:40px !important;padding:44px 0 56px !important}
}
@media (max-width:520px){
.hcol{zoom:.6}
.pscene{zoom:.58}
}
.wd{display:inline-block}
.kick{font-size:14px;font-weight:700;letter-spacing:2px;color:#D6336C}
.fright{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.flinks{display:flex;flex-wrap:wrap;gap:4px 24px;justify-content:flex-end}
.flink{color:#fff;text-decoration:none;font-size:17px;font-weight:600;padding:10px 2px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.flink:hover{color:#FFB3D1;border-bottom-color:#FFB3D1}
.flink.on{color:#FF8FB8}
@media (max-width:900px){
.fright{align-items:flex-start;gap:8px}
.flinks{justify-content:flex-start;gap:0 20px}
.flink{font-size:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="position:relative;overflow:hidden;box-sizing:border-box;background:#BDEBFF;font-family:Fredoka,sans-serif;color:#3B1E54">
<div class="topbar" style="position:relative;z-index:12;padding:14px 32px;box-sizing:border-box;background-color:#3b1e54">
<div class="tb-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;max-width:1500px;margin:0 auto">
<div class="tb-left" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
<div class="tb-pill tb-del" style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 18px 8px 10px;color:#3B1E54"><div class="tb-ico" style="width:34px;height:34px;border-radius:50%;background:#EDE6F5;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B1E54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><div class="tb-dtext" style="line-height:1.1"><div class="tb-dlabel" style="font-size:11px;font-weight:700;letter-spacing:.5px">DELIVERY</div><div class="tb-daddr" style="font-size:17px;font-weight:600">Sprinkle Street 12</div></div><svg class="tb-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3B1E54" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
<div class="tb-pill tb-phone" style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 20px 8px 10px;color:#3B1E54"><div class="tb-ico" style="width:34px;height:34px;border-radius:50%;background:#EDE6F5;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B1E54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div><div class="tb-ptext" style="font-size:17px;font-weight:600">[PHONE NUMBER]</div></div>
</div>
<div class="tb-sp"></div>
<div class="tb-links" style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
<a class="nl2" href="index.html">Home</a>
<a class="nl2" href="about.html">About</a>
<a class="nl2" href="shops.html" style="color:#FF8FB8">Shops</a>
<a class="nl2" href="contact.html">Contact Us</a>
</div>
</div>
<button id="logo-face" class="logo {{ faceCls }}" aria-label="Scoopy logo. Click to turn it into a smiley face and back" aria-pressed="{{ facePressed }}" onClick="{{ toggleFace }}" style="position:absolute;left:50%;top:0;transform:translateX(-50%);width:170px;height:100px;border:0;padding:0;margin:0;border-radius:0 0 85px 85px;background-color:#3B1E54;overflow:hidden;cursor:pointer;font-family:inherit;font-size:36px;font-weight:700;color:#FF8FB8;text-shadow:0 3px 0 rgba(0,0,0,.3)"><span class="lt lS">S</span><span class="lt lc">c</span><span class="lt lo1">o</span><span class="lt lo2">o</span><span class="lt lp">p</span><span class="lt ly">y</span><i class="smile"></i><i class="ball b1"><i class="pupil"><i class="dot"></i></i></i><i class="ball b2"><i class="pupil"><i class="dot"></i></i></i></button>
</div>


<div class="spad" style="max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box">
<div class="shead" style="text-align:center;padding:72px 0 36px">
<h1 class="h1s" style="margin:0;font-weight:700;font-size:clamp(44px,6.5vw,88px);line-height:1;color:#fff;text-shadow:1px 1px 0 #D6336C,2px 2px 0 #D6336C,3px 3px 0 #D6336C,4px 4px 0 #D6336C,5px 5px 0 #D6336C,6px 6px 0 #D6336C,0 16px 20px rgba(59,30,84,.28)"><span class="wd">Find</span> <span class="wd">Our</span> <span class="wd">Scoop</span> <span class="wd">Shops</span></h1>
<p class="shp" style="margin:24px auto 0;max-width:620px;font-size:24px;line-height:1.4;font-weight:500">Tap a shop pin and our ice cream van will cruise through the city streets to get there!</p>
</div>

<div class="mapvp" style="position:relative;height:740px;border-radius:44px;overflow:hidden;border:8px solid #fff;box-sizing:border-box;background:linear-gradient(180deg,#7FD2FF 0%,#C9EDFF 40%,#EAF8FF 100%);perspective:1000px;perspective-origin:50% 62%;box-shadow:0 14px 0 #9AA9D6,0 30px 50px rgba(59,30,84,.2)">

<div class="shcam" style="position:absolute;left:50%;top:80%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(58deg) scale(1.3)">

<div id="world" style="position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0;will-change:transform">
<div style="position:absolute;left:0;top:0;width:0;height:0">
<sc-for list="{{ flatA }}" as="f" hint-placeholder-count="8"><div style="{{ f.style }}"></div></sc-for>
<sc-for list="{{ flatB }}" as="f" hint-placeholder-count="8"><div style="{{ f.style }}"></div></sc-for>
</div>
<sc-for list="{{ chunks }}" as="ch" hint-placeholder-count="4"><div class="chunk" style="position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d"><sc-for list="{{ ch.faces }}" as="w" hint-placeholder-count="6"><div style="{{ w.style }}"></div></sc-for></div></sc-for>
<sc-for list="{{ cars }}" as="c" hint-placeholder-count="4">
<div class="{{ c.cls }}" style="{{ c.style }}" >
<sc-for list="{{ c.faces }}" as="w" hint-placeholder-count="6"><div style="{{ w.style }}"></div></sc-for>
</div>
</sc-for>
<sc-for list="{{ markers }}" as="m" hint-placeholder-count="6">
<div class="mkw" style="position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translate3d({{ m.cx }}px,{{ m.cy }}px,{{ m.z }}px)">
<div class="mkb" style="position:absolute;left:-70px;top:-122px;width:140px;height:122px;transform-origin:70px 122px;transform:rotateX(-58deg)">
<div class="{{ m.fcls }}" style="position:relative;width:140px;height:122px">
<button class="mk-btn" aria-label="{{ m.name }}" onClick="{{ m.go }}" style="position:relative;width:140px;height:122px;transform:scale({{ m.scale }});transform-origin:70px 122px;transition:transform .25s ease-out">
<div style="position:absolute;left:50%;top:0;transform:translateX(-50%);white-space:nowrap;background:{{ m.pillBg }};color:{{ m.pillColor }};font-family:Fredoka,sans-serif;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(59,30,84,.25)">{{ m.name }}</div>
<sc-if value="{{ m.on }}" hint-placeholder-val="{{ false }}"><div class="ring" style="position:absolute;left:39px;top:30px;width:62px;height:62px;border-radius:50%;border:3px solid #FFE066"></div></sc-if>
<div style="position:absolute;left:36px;top:28px;width:68px;height:68px;border-radius:50%;background:linear-gradient(145deg,#C9B0FF 0%,#8E5CF0 48%,#FF8FB8 100%);box-shadow:{{ m.badgeShadow }}"></div>
<div style="position:absolute;left:43px;top:35px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff 0,#F4EEFF 55%,#E0D2FF 100%)"></div>
<svg style="position:absolute;left:49px;top:39px" width="42" height="46" viewBox="0 0 48 52"><path d="M15 27h18L24 49z" fill="#F2B25C" stroke="#B87420" stroke-width="1.5" stroke-linejoin="round"/><path d="M19 31l5 14M29 31l-5 14M17 36h14M20 41h8" stroke="#B87420" stroke-width="1" opacity=".55"/><path d="M12 25c0-6 5-10 12-10s12 4 12 10c0 2-2 3-4 2l-3 4-3-3-3 4-3-4-3 3-3-4c-2 1-4 0-4-2z" fill="{{ m.c2 }}"/><circle cx="24" cy="15" r="9.5" fill="{{ m.c1 }}"/><ellipse cx="20" cy="11.5" rx="3.6" ry="2.2" fill="#fff" opacity=".6"/><rect x="26" y="9" width="2.4" height="6" rx="1.2" fill="#fff" transform="rotate(30 27 12)"/><rect x="18" y="16" width="2.4" height="6" rx="1.2" fill="#FFE066" transform="rotate(-30 19 19)"/><rect x="29" y="18" width="2.4" height="6" rx="1.2" fill="#7CC8FF" transform="rotate(60 30 21)"/><circle cx="24" cy="4.6" r="3.4" fill="#E0243F"/><circle cx="23" cy="3.6" r="1" fill="#fff" opacity=".8"/></svg>
<div style="position:absolute;left:62px;top:92px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid #fff"></div>
</button>
</div>
</div>
</div>
</sc-for>
</div>

<div style="position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d">
<div style="position:absolute;left:-44px;top:-66px;width:88px;height:150px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(59,30,84,.42) 0,rgba(59,30,84,.28) 55%,rgba(59,30,84,0) 72%);transform:translate3d(0,6px,0.5px)"></div>

}

const on = sel === s.id;

});

return {
faceCls: this.state.face ? 'face' : '',
facePressed: String(!!this.state.face),

mmShops: this.shops.map((s) => { const p = this.mmap(s.stopX, s.stopY); return { name: s.name, c1: s.c1, x: p[0].toFixed(1), y: p[1].toFixed(1), ring: sel === s.id ? '#D6336C' : '#fff', go: () => this.go(s.id) }; }),
status,

};
}
}
