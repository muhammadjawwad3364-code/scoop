<h2 class="ah2" style="color:#3B1E54">It all started with one little cart</h2>
<p class="ap">In the summer of 2014, Lena Moretti pushed a squeaky pink cart onto Sprinkle Street with one cooler, three flavors and a hand-painted sign. Her grandpa Theo had taught her to churn ice cream in his tiny kitchen, and she wanted the whole street to taste it.</p>
